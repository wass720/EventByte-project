spring:
  application:
    name: eventbyte
  datasource:
    url: jdbc:postgresql://localhost:5432/eventbyte
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    # Sans ça, une lecture JPA garde sa connexion SQL jusqu'à la fin de la requête HTTP,
    # et un JdbcClient dans la même requête en réclame une 2e : le pool se bloque en charge.
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eventbyte

meilisearch:
  host: http://localhost:7700
  api-key: Cd9_wZ5drjqixClHEnbof-4h0bgktUzXwaY3yt8wJoM

eventbyte:
  booking:
    payment-window: 10m
    expiration-check-interval: 10s
    # Frais de service par ticket, en centimes (US-16).
    fee-per-ticket: 30
    # Plus petit total payable par carte, en centimes (minimum Stripe en euros : 0,50 €).
    minimum-total: 50
  stripe:
    # Clé secrète Stripe (sk_test_...) : variable d'environnement, jamais en dur ici.
    secret-key: ${STRIPE_SECRET_KEY:}
    currency: eur
  discover:
    radius-km: 50
  cors:
    allowed-origins: http://localhost:5173
